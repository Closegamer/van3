name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Validate Docker Compose
        run: |
          set -e
          cp .env.docker.example .env.docker
          sed -i 's/change_me_strong_password/ci_validation_only/' .env.docker
          docker compose --env-file .env.docker config >/dev/null

      - name: Check Node scripts (syntax)
        run: |
          node --check scripts/import_completed_to_yxxxxxx.mjs
          node --check scripts/provision_vandb.mjs

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 30
    concurrency:
      group: van3-deploy-production
      cancel-in-progress: false

    steps:
      - name: Verify deploy secrets (non-empty)
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
          VAN_POSTGRES_PASSWORD: ${{ secrets.VAN_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          ok=true
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_APP_DIR GH_REPO_TOKEN VAN_POSTGRES_PASSWORD; do
            if [ -z "${!v:-}" ]; then echo "::error::Secret $v is empty or not set"; ok=false; fi
          done
          if [ "$ok" != true ]; then exit 1; fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          POSTGRES_USER: ${{ secrets.VAN_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.VAN_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.VAN_POSTGRES_DB }}
          VAN_POSTGRES_PUBLISH: ${{ secrets.VAN_POSTGRES_PUBLISH }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          DEPLOY_GH_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
          DEPLOY_REPO_SLUG: ${{ github.repository }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_KEY_PASSPHRASE }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 30m
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,VAN_POSTGRES_PUBLISH,DEPLOY_APP_DIR,DEPLOY_GH_TOKEN,DEPLOY_REPO_SLUG
          script_stop: true
          script: |
            set -e
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
            APP_DIR="$DEPLOY_APP_DIR"
            REPO_URL="https://x-access-token:${DEPLOY_GH_TOKEN}@github.com/${DEPLOY_REPO_SLUG}.git"

            if [ -z "$APP_DIR" ] || [ "${APP_DIR#/}" = "$APP_DIR" ]; then
              echo "::error::DEPLOY_APP_DIR must be a non-empty absolute path (e.g. /home/deploy/apps/van3)"
              exit 1
            fi

            if ! command -v git >/dev/null 2>&1; then
              echo "::error::git is not installed on the server (sudo apt install git)"
              exit 1
            fi

            parent="$(dirname "$APP_DIR")"
            if ! mkdir -p "$parent"; then
              echo "::error::Cannot mkdir $parent — fix permissions or pick a path under the SSH user home (e.g. /home/deploy/apps/van3)"
              exit 1
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              if ! git clone "$REPO_URL" "$APP_DIR"; then
                echo "::error::git clone failed — check GH_REPO_TOKEN (repo access) and network"
                exit 1
              fi
            fi

            cd "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR" 2>/dev/null || true
            git remote set-url origin "$REPO_URL"
            if ! git fetch origin main; then
              echo "::error::git fetch failed — token, branch main, или safe.directory (см. лог выше)"
              exit 1
            fi
            if ! git reset --hard origin/main; then
              echo "::error::git reset --hard origin/main failed"
              exit 1
            fi

            write_env_docker() {
              key="$1"
              val="$2"
              clean="$(printf '%s' "$val" | tr -d '\r\n' | sed 's/[[:space:]]\+$//')"
              esc="$(printf '%s' "$clean" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e 's/\$/\\$/g' -e 's/`/\\`/g')"
              printf '%s="%s"\n' "$key" "$esc" >> .env.docker
            }

            : > .env.docker
            write_env_docker POSTGRES_USER "${POSTGRES_USER:-vanuser}"
            write_env_docker POSTGRES_PASSWORD "${POSTGRES_PASSWORD}"
            write_env_docker POSTGRES_DB "${POSTGRES_DB:-vandb}"
            write_env_docker VAN_POSTGRES_PUBLISH "${VAN_POSTGRES_PUBLISH:-5432}"

            if ! docker info >/dev/null 2>&1; then
              echo "::error::Docker недоступен (установите Docker и добавьте SSH-пользователя в группу docker, затем перелогин)"
              exit 1
            fi

            if docker compose version >/dev/null 2>&1; then
              docker compose --env-file .env.docker pull 2>/dev/null || true
              if ! docker compose --env-file .env.docker config >/dev/null 2>&1; then
                echo "::error::docker compose config не прошёл — синтаксис compose/.env.docker или переменные (пароль не выводим в лог)."
                exit 1
              fi
              if ! docker compose --env-file .env.docker up -d --remove-orphans; then
                echo "::error::Если в логе выше есть 'port is already allocated' — на хосте занят порт из VAN_POSTGRES_PUBLISH (часто 5432). В Secrets задайте другой, напр. VAN_POSTGRES_PUBLISH=55432; в .env для run_van — VAN_DB_PORT=55432. Проверка: ss -tlnp | grep -E '5432|55432'"
                echo "=== memory / disk ==="
                free -h 2>/dev/null || true
                df -h 2>/dev/null | head -20 || true
                echo "=== docker compose ps -a ==="
                docker compose --env-file .env.docker ps -a 2>&1 || true
                echo "=== docker compose logs (last 200 lines) ==="
                docker compose --env-file .env.docker logs --tail 200 2>&1 || true
                exit 1
              fi
              docker compose --env-file .env.docker ps || true
            else
              set -a
              # shellcheck disable=SC1090
              . ./.env.docker
              set +a
              docker-compose pull 2>/dev/null || true
              if ! docker-compose up -d --remove-orphans; then
                echo "=== docker-compose up failed (last 100 log lines) ==="
                docker-compose logs --tail 100 2>&1 || true
                exit 1
              fi
              docker-compose ps || true
            fi
